# ChaosForge version catalog — ALL versions pinned here.
# architecture specification / build-prompt: Gradle only, no Maven, no SNAPSHOT, no :latest image tags.
#
# VERIFY-BEFORE-BUILD: Spring Boot 4.1.x, Spring AI 2.0.x, Spring Kafka 4.x, and Apicurio 3.x are
# forward-looking per the project spec. Confirm each exact version resolves against its published
# BOM before the first build; none may be a SNAPSHOT. Versions managed transitively by the Spring
# Boot BOM are intentionally omitted here (postgresql, flyway, caffeine is pinned, micrometer,
# lettuce, spring-kafka, junit, testcontainers-bom is pinned).

[versions]
java = "21"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
springAi = "2.0.0"
resilience4j = "2.4.0"   # 2.4.0 = first release with the spring-boot4 integration module
avro = "1.12.2"
avroPlugin = "1.9.1"
uuidCreator = "6.1.1"
jspecify = "1.0.1"
archunit = "1.5.0"
testcontainers = "2.0.5"
caffeine = "3.2.4"
junit = "6.1.3"        # matches the Spring Boot 4.1 BOM-managed JUnit in the other modules
assertj = "3.27.7"     # matches the Spring Boot 4.1 BOM-managed AssertJ

[libraries]
avro = { module = "org.apache.avro:avro", version.ref = "avro" }

# --- Resilience4j: per-boundary CB / bulkhead / timeout (no global defaults) ---
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }

# --- Spring AI: Control Plane ONLY (ADR-0518 / ADR-0521). Version resolved from spring-ai-bom. ---
springAi-starter-ollama = { module = "org.springframework.ai:spring-ai-starter-model-ollama" }

# --- Misc ---
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }   # UUIDv7 message_id
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }                    # @NonNull/@Nullable (Boot 4)
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }   # L1 cache

# --- Test ---
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
# Explicit JUnit/AssertJ for the plain java-library modules (e.g. chaosforge-avro-schemas) that do not
# pull spring-boot-starter-test. Versions match the Boot 4.1 BOM so there is no cross-module skew.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
avro = { id = "com.github.davidmc24.gradle.plugin.avro", version.ref = "avroPlugin" }
