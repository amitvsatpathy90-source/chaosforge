name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday scan

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      # Gradle multi-project build — compiles edge-gateway, control-plane, execution-service
      # in one invocation (no per-module loop needed, unlike Maven no-root-pom setups).
      # compileJava depends on avroGenerateJava (Avro plugin hooks compile automatically),
      # so generated Avro codegen is indexed by CodeQL too — no separate codegen step.
      - name: Build all services
        run: ./gradlew compileJava compileTestJava -x test --no-daemon
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
